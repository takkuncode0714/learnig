<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原宿・表参道 グルメファインダー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">
        <span class="header-icon">🍽️</span>
        原宿・表参道<br><small>グルメファインダー</small>
      </h1>
      <p class="header-sub">食べたいもの・飲みたいものから<br>お店を見つけよう</p>
    </div>
  </header>

  <main class="main">
    <section class="search-section">
      <div class="search-box-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="例：ラーメン、コーヒー、パンケーキ…"
          autocomplete="off"
        >
        <button class="search-clear" id="searchClear" aria-label="クリア">✕</button>
      </div>

      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">エリア</span>
          <div class="filter-chips" id="areaChips">
            <button class="chip chip--active" data-area="all">すべて</button>
            <button class="chip" data-area="原宿">原宿</button>
            <button class="chip" data-area="表参道">表参道</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">カテゴリー</span>
          <div class="filter-chips" id="categoryChips">
            <button class="chip chip--active" data-category="all">すべて</button>
          </div>
        </div>
      </div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <span id="resultsCount" class="results-count">0件</span>
        <span class="results-label">のお店が見つかりました</span>
      </div>
      <div id="restaurantGrid" class="restaurant-grid"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">😔</div>
        <p>条件に合うお店が見つかりませんでした</p>
        <button class="reset-btn" id="resetBtn">条件をリセット</button>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
