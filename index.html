<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマーアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>タイマー</h1>

    <div class="display" id="display">00:00:00</div>

    <div class="input-section">
      <label>時間を設定:</label>
      <div class="time-inputs">
        <div class="time-input-group">
          <input type="number" id="hours" min="0" max="99" value="0">
          <label for="hours">時間</label>
        </div>
        <div class="time-input-group">
          <input type="number" id="minutes" min="0" max="59" value="0">
          <label for="minutes">分</label>
        </div>
        <div class="time-input-group">
          <input type="number" id="seconds" min="0" max="59" value="0">
          <label for="seconds">秒</label>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start">スタート</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>一時停止</button>
      <button id="resetBtn" class="btn btn-reset">リセット</button>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="message" class="message hidden">⏰ 時間になりました！</div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
